name: genuiform_a2ui
description: "Shared A2UI v0.9 outcome-screen plumbing for genuiform — Vertex emit, message processor wiring, fallback rendering, action handler. Used by genuiform_workbench and the example app."
publish_to: 'none'
version: 0.1.0-dev

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  genuiform:
    path: ../

  # A2UI Dart SDKs. The outcome screen still speaks A2UI v0.9 on the wire.
  a2ui_core: ^0.6.0
  a2ui_flutter: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
